<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flete por Comuna – Región Metropolitana</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: white;
  font-family: Arial, sans-serif;
}

#map {
  width: 100vw;
  height: 100vh;
}

/* ===============================
   BUSCADOR
================================ */

#search-box {
  position: absolute;
  top: 15px;
  left: 15px;
  background: white;
  padding: 10px 12px;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  z-index: 1000;
  width: 240px;
}

#search-box label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 4px;
}

#comuna-input {
  width: 100%;
  height: 30px;
  padding: 4px 6px;
  font-size: 14px;
  box-sizing: border-box;
}

#dropdown {
  margin-top: 4px;
  border: 1px solid #ccc;
  border-radius: 4px;
  max-height: 160px;
  overflow-y: auto;
  display: none;
  background: white;
}

.dropdown-item {
  padding: 6px;
  cursor: pointer;
  font-size: 14px;
}

.dropdown-item:hover {
  background: #f0f0f0;
}

/* ===============================
   LEYENDA
================================ */

#leyenda {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid #e0e0e0;
  font-size: 12.5px;
}

.leyenda-item {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.color-box {
  width: 14px;
  height: 14px;
  border-radius: 3px;
}

#nota-leyenda {
  margin-top: 6px;
  font-size: 11px;
  color: #555;
  line-height: 1.3em;
}

/* ===============================
   INFO
================================ */

.info {
  position: absolute;
  bottom: 20px;
  left: 15px;
  background: white;
  padding: 12px 16px;
  font-size: 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  z-index: 999;
}

/* ===============================
   COMUNAS + ANIMACIÓN
================================ */

.comuna {
  transition: fill-opacity 0.25s ease, stroke-width 0.25s ease, stroke 0.25s ease;
}

.comuna-seleccionada {
  animation: pulsoBorde 1.8s ease-in-out infinite;
}

@keyframes pulsoBorde {
  0% { stroke-width: 3; }
  50% { stroke-width: 5; }
  100% { stroke-width: 3; }
}

/* ===============================
   LABEL COMUNA
================================ */

.leaflet-tooltip.comuna-label {
  background: rgba(255,255,255,0.9);
  border: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  font-weight: bold;
  font-size: 14px;
  color: #000;
  padding: 4px 8px;
  border-radius: 4px;
}
</style>
</head>

<body>

<div id="search-box">
  <label>Buscar comuna</label>
  <input id="comuna-input" placeholder="Escriba una comuna">
  <div id="dropdown"></div>

  <div id="leyenda">
    <div class="leyenda-item">
      <div style="width:30px;height:4px;background:#c00000;opacity:0.6;border-radius:2px;"></div>
      <div>Autopista Américo Vespucio</div>
    </div>

    <div class="leyenda-item">
      <div class="color-box" style="background:#4CAF50;"></div>
      <div>Zona A – $5.000</div>
    </div>

    <div class="leyenda-item">
      <div class="color-box" style="background:#FFC107;"></div>
      <div>Zona B – $8.000</div>
    </div>

    <div class="leyenda-item">
      <div class="color-box" style="background:#F44336;"></div>
      <div>Zona C – $10.000</div>
    </div>

    <div id="nota-leyenda">
      Valores calculados según distancia estimada desde Providencia.
    </div>
  </div>
</div>

<div id="map"></div>

<div class="info" id="info">
  Seleccione una comuna
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ===============================
   CATEGORÍAS
================================ */

const COMUNAS_A = [
  "Providencia","Ñuñoa","Recoleta","Macul","Santiago",
  "Independencia","Estación Central","Peñalolén",
  "Las Condes","Huechuraba","La Reina",
  "Vitacura","Quinta Normal","Conchalí"
];

const COMUNAS_B = [
  "Renca","La Florida","San Miguel","Lo Prado",
  "Pedro Aguirre Cerda","San Joaquín",
  "Cerro Navia","La Granja",
  "Quilicura","Lo Espejo"
];

const COMUNAS_C = [
  "Lo Barnechea","La Cisterna","Cerrillos","El Bosque",
  "San Ramón","La Pintana","Pudahuel","Maipú",
  "Puente Alto","San Bernardo","Lampa"
];

function obtenerFlete(comuna) {
  if (COMUNAS_A.includes(comuna)) return 5000;
  if (COMUNAS_B.includes(comuna)) return 8000;
  if (COMUNAS_C.includes(comuna)) return 10000;
  return 0;
}

function obtenerColor(comuna) {
  if (COMUNAS_A.includes(comuna)) return "#4CAF50";
  if (COMUNAS_B.includes(comuna)) return "#FFC107";
  if (COMUNAS_C.includes(comuna)) return "#F44336";
  return "#cccccc";
}

/* ===============================
   MAPA
================================ */

const map = L.map('map', {
  zoomControl: false,
  minZoom: 10,
  maxZoom: 13
}).setView([-33.45, -70.66], 10);

L.control.zoom({ position: 'bottomright' }).addTo(map);

map.setMaxBounds([
  [-34.2, -71.6],
  [-32.8, -69.9]
]);

let geojson;
let capasPorComuna = {};
let comunaSeleccionada = null;
let labelActivo = null;

function estilo(feature) {
  const nombre = feature.properties.NOM_COM || feature.properties.COMUNA;
  return {
    fillColor: obtenerColor(nombre),
    weight: 0.8,
    color: "#999",
    fillOpacity: 0.55,
    className: "comuna"
  };
}

function seleccionar(layer, nombre) {
  if (comunaSeleccionada) comunaSeleccionada.getElement()?.classList.remove("comuna-seleccionada");
  if (labelActivo) map.removeLayer(labelActivo);

  comunaSeleccionada = layer;
  geojson.resetStyle();

  layer.setStyle({
    fillOpacity: 0.9,
    weight: 3,
    color: "#000"
  });

  layer.getElement()?.classList.add("comuna-seleccionada");

  map.fitBounds(layer.getBounds(), { maxZoom: 12 });

  const flete = obtenerFlete(nombre);

  document.getElementById("info").innerHTML =
    `<strong>${nombre}</strong><br>Flete: $${flete.toLocaleString("es-CL")}`;

  labelActivo = L.tooltip({
    permanent: true,
    direction: "center",
    className: "comuna-label"
  })
  .setContent(nombre)
  .setLatLng(layer.getBounds().getCenter())
  .addTo(map);
}

const COMUNAS_ACTIVAS = [...COMUNAS_A, ...COMUNAS_B, ...COMUNAS_C];

fetch("https://services3.arcgis.com/uZrwedu11XCCdHk1/ArcGIS/rest/services/Comunas_de_la_RM/FeatureServer/1/query?where=1=1&outFields=*&f=geojson")
.then(r => r.json())
.then(data => {

  geojson = L.geoJSON(data, {
    filter: f => COMUNAS_ACTIVAS.includes(f.properties.NOM_COM || f.properties.COMUNA || ""),
    style: estilo,
    onEachFeature: (f,l) => {
      const nombre = f.properties.NOM_COM || f.properties.COMUNA;
      capasPorComuna[nombre] = l;
      l.on("click", () => seleccionar(l, nombre));
    }
  }).addTo(map);

  map.fitBounds(geojson.getBounds());

  fetch("./data/americo_vespucio.geojson")
    .then(r => r.json())
    .then(avData => {
      L.geoJSON(avData, {
        style: { color:"#c00000", weight:4, opacity:0.6 }
      })
      .bindTooltip("Autopista Américo Vespucio", { sticky:true })
      .addTo(map);
    });
});

/* ===============================
   BUSCADOR
================================ */

const input = document.getElementById("comuna-input");
const dropdown = document.getElementById("dropdown");

input.addEventListener("input", () => {
  const texto = input.value.toLowerCase();
  dropdown.innerHTML = "";

  if (!texto) return dropdown.style.display = "none";

  COMUNAS_ACTIVAS.filter(c => c.toLowerCase().includes(texto))
    .forEach(nombre => {
      const div = document.createElement("div");
      div.className = "dropdown-item";
      div.textContent = nombre;
      div.onclick = () => {
        input.value = nombre;
        dropdown.style.display = "none";
        seleccionar(capasPorComuna[nombre], nombre);
      };
      dropdown.appendChild(div);
    });

  dropdown.style.display = "block";
});

document.addEventListener("click", e => {
  if (!document.getElementById("search-box").contains(e.target)) {
    dropdown.style.display = "none";
  }
});
</script>

</body>
</html>
