<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flete por Comuna – Región Metropolitana</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
   body {
  font-family: Arial, sans-serif;
}

/* ===============================
   CAMIÓN PRO REALISTA
================================ */

#camion-container {
  position: relative;
  width: 100%;
  height: 70px;
  margin-top: 14px;
  overflow: hidden;
  display: none;
}

/* CARRETERA */
#carretera {
  position: absolute;
  bottom: 15px;
  width: 100%;
  height: 8px;
  background: #444;
  border-radius: 4px;
  overflow: hidden;
}

#linea-central {
  position: absolute;
  top: 3px;
  left: 0;
  width: 200%;
  height: 2px;
  background: repeating-linear-gradient(
    to right,
    white 0px,
    white 18px,
    transparent 18px,
    transparent 36px
  );
}

/* CAMIÓN */
#camion-wrapper {
  position: absolute;
  bottom: 25px;
  left: -50px;
}

#camion {
  font-size: 28px;
}

/* HUMO */
.humo {
  position: absolute;
  bottom: 15px;
  width: 14px;
  height: 14px;
  background: rgba(120,120,120,0.8);
  border-radius: 50%;
  opacity: 0;
  filter: blur(3px);
}
/* humo lado izquierdo */
.humo-izq {
  left: 12px;
}

/* humo lado derecho */
.humo-der {
  right: 12px;
}

/* ANIMACIONES */
.camion-moviendo #camion-wrapper {
  animation: moverIdaVuelta 3s linear forwards;
}

.camion-moviendo #camion {
  animation: vibrar 0.15s infinite;
}

.camion-moviendo .humo {
  animation: salirHumo 1s ease-out infinite;
}

.camion-moviendo #linea-central {
  animation: carreteraIdaVuelta 3s linear forwards;
}

@keyframes moverIdaVuelta {

  /* IDA → derecha (humo atrás = izquierda) */
  0%   { left: -50px; transform: scaleX(-1); }
  45%  { left: 100%; transform: scaleX(-1); }

  /* CAMBIO DE DIRECCIÓN */
  50%  { left: 100%; transform: scaleX(1); }

  /* VUELTA ← izquierda (humo atrás = derecha) */
  95%  { left: -50px; transform: scaleX(1); }

  100% { left: -50px; transform: scaleX(-1); }
}

@keyframes carreteraIdaVuelta {
  0%   { transform: translateX(0); }
  45%  { transform: translateX(-60px); }
  50%  { transform: translateX(-60px); }
  95%  { transform: translateX(0); }
  100% { transform: translateX(0); }
}

@keyframes vibrar {
  0%   { transform: translate(0,0); }
  50%  { transform: translate(0.5px,-0.5px); }
  100% { transform: translate(0,0); }
}

@keyframes salirHumo {
  0%   { opacity: 0.7; transform: translate(0,0) scale(0.5); }
  50%  { opacity: 0.4; transform: translate(-10px,-10px) scale(1); }
  100% { opacity: 0; transform: translate(-20px,-20px) scale(1.4); }
}

/* ===============================
   BUSCADOR
================================ */
#search-box {
  position: absolute;
  top: 15px;
  left: 15px;
  background: white;
  padding: 10px 12px;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  z-index: 1000;
  width: 240px;
}

#search-box label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 4px;
}

#comuna-input {
  width: 100%;
  height: 30px;
  padding: 4px 6px;
  font-size: 14px;
  box-sizing: border-box;
}

#dropdown {
  margin-top: 4px;
  border: 1px solid #ccc;
  border-radius: 4px;
  max-height: 160px;
  overflow-y: auto;
  display: none;
  background: white;
}

.dropdown-item {
  padding: 6px;
  cursor: pointer;
  font-size: 14px;
}

.dropdown-item:hover {
  background: #f0f0f0;
}

/* ===============================
   LEYENDA
================================ */
#leyenda {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid #e0e0e0;
  font-size: 12.5px;
}

.leyenda-item {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.color-box {
  width: 14px;
  height: 14px;
  border-radius: 3px;
}

#nota-leyenda {
  margin-top: 6px;
  font-size: 11px;
  color: #555;
  line-height: 1.3em;
}

/* ===============================
   INFO
================================ */
.info {
  position: absolute;
  bottom: 20px;
  left: 15px;
  background: white;
  padding: 14px 18px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  z-index: 999;
  min-width: 260px;
}

.valor-flete {
  font-size: 22px;
  font-weight: bold;
  color: #000;
  margin-top: 6px;
}

/* ===============================
   COMUNAS + ANIMACIÓN
================================ */
.comuna {
  transition: fill-opacity 0.25s ease, stroke-width 0.25s ease, stroke 0.25s ease;
}

.comuna-seleccionada {
  animation: pulsoBorde 1.8s ease-in-out infinite;
}

@keyframes pulsoBorde {
  0% { stroke-width: 3; }
  50% { stroke-width: 5; }
  100% { stroke-width: 3; }
}

/* ===============================
   LABEL COMUNA
================================ */
.leaflet-tooltip.comuna-label {
  background: rgba(255,255,255,0.9);
  border: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  font-weight: bold;
  font-size: 14px;
  color: #000;
  padding: 4px 8px;
  border-radius: 4px;
}
</style>
</head>
<body>

<div id="search-box">
  <label>Buscar comuna</label>
  <input id="comuna-input" placeholder="Escriba una comuna">
  <div id="dropdown"></div>

  <div id="leyenda">
    <div class="leyenda-item">
      <div style="width:30px;height:4px;background:#c00000;opacity:0.6;border-radius:2px;"></div>
      <div>Autopista Américo Vespucio</div>
    </div>

    <div class="leyenda-item">
      <div class="color-box" style="background:#4CAF50;"></div>
      <div>Zona A – $5.000</div>
    </div>

    <div class="leyenda-item">
      <div class="color-box" style="background:#FFC107;"></div>
      <div>Zona B – $8.000</div>
    </div>

    <div class="leyenda-item">
      <div class="color-box" style="background:#F44336;"></div>
      <div>Zona C – $10.000</div>
    </div>

    <div id="nota-leyenda">
      Valores calculados según distancia estimada ida y vuelta desde Providencia.
    </div>
  </div>
</div>

<div id="map" style="width:100%; height:100vh;"></div>

<div class="info" id="info">
  <div id="info-content">
    Seleccione una comuna
  </div>

  <div id="camion-container">
    <div id="carretera">
      <div id="linea-central"></div>
    </div>

    <div class="camion-wrapper derecha" id="camion">
  <div class="humo"></div>
  <div class="camion">🚚</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===============================
   DISTANCIAS
================================ */
const DISTANCIAS = {
  "Providencia": 1, "Ñuñoa": 6.8, "Recoleta": 12.6, "Macul": 13.2,
  "Santiago": 13.4, "Independencia": 13.8, "Estación Central": 15.3,
  "Peñalolén": 17.2, "Las Condes": 17.2, "Huechuraba": 17.4,
  "La Reina": 18, "Vitacura": 19.2, "Quinta Normal": 21.6,
  "Conchalí": 23.8, "Renca": 25, "La Florida": 25.4,
  "San Miguel": 26.8, "Lo Prado": 29.4, "Pedro Aguirre Cerda": 29.8,
  "San Joaquín": 31, "Cerro Navia": 31.6, "La Granja": 32.6,
  "Quilicura": 34.6, "Lo Espejo": 35.8, "Lo Barnechea": 35.8,
  "La Cisterna": 36.4, "San Ramón": 40.1, "Cerrillos": 41.8,
  "El Bosque": 44.2, "La Pintana": 44.8, "Pudahuel": 45.6,
  "Maipú": 51.8, "Puente Alto": 53, "San Bernardo": 53.6,
  "Lampa": 73
};

/* ===============================
   ZONAS
================================ */
const COMUNAS_A = ["Providencia","Ñuñoa","Recoleta","Macul","Santiago","Independencia","Estación Central","Peñalolén","Las Condes","Huechuraba","La Reina","Vitacura","Quinta Normal","Conchalí"];
const COMUNAS_B = ["Renca","La Florida","San Miguel","Lo Prado","Pedro Aguirre Cerda","San Joaquín","Cerro Navia","La Granja","Quilicura","Lo Espejo","La Cisterna","San Ramón"];
const COMUNAS_C = ["Lo Barnechea","Cerrillos","El Bosque","La Pintana","Pudahuel","Maipú","Puente Alto","San Bernardo","Lampa"];

function obtenerZona(comuna){
  if(COMUNAS_A.includes(comuna)) return "A";
  if(COMUNAS_B.includes(comuna)) return "B";
  if(COMUNAS_C.includes(comuna)) return "C";
  return "-";
}

function obtenerFlete(comuna){
  const zona = obtenerZona(comuna);
  if(zona==="A") return 5000;
  if(zona==="B") return 8000;
  if(zona==="C") return 10000;
  return 0;
}

function obtenerColor(comuna){
  const zona = obtenerZona(comuna);
  if(zona==="A") return "#4CAF50";
  if(zona==="B") return "#FFC107";
  if(zona==="C") return "#F44336";
  return "#ccc";
}

/* ===============================
   MAPA
================================ */
const map = L.map('map',{ zoomControl:false, minZoom:10, maxZoom:13 }).setView([-33.45,-70.66],10);
L.control.zoom({position:'bottomright'}).addTo(map);
map.setMaxBounds([[-34.2,-71.6],[-32.8,-69.9]]);

let geojson;
let capasPorComuna = {};
let comunaSeleccionada = null;
let labelActivo = null;

function estilo(feature){
  const nombre = feature.properties.NOM_COM || feature.properties.COMUNA;
  return { fillColor:obtenerColor(nombre), weight:0.8, color:"#999", fillOpacity:0.55, className:"comuna" };
}

function seleccionar(layer,nombre){
  if(comunaSeleccionada) comunaSeleccionada.getElement()?.classList.remove("comuna-seleccionada");
  if(labelActivo) map.removeLayer(labelActivo);

  comunaSeleccionada = layer;
  geojson.resetStyle();

  layer.setStyle({ fillOpacity:0.9, weight:3, color:"#000" });
  layer.getElement()?.classList.add("comuna-seleccionada");
  map.fitBounds(layer.getBounds(),{maxZoom:12});

  const distancia = DISTANCIAS[nombre] || 0;
  const zona = obtenerZona(nombre);
  const flete = obtenerFlete(nombre);

  const colorZona = obtenerColor(nombre);

document.getElementById("info-content").innerHTML = `
  <div style="margin-bottom:8px;">
    <div style="font-size:13px; color:#555;">Comuna:</div>
    <div style="font-size:18px; font-weight:bold;">${nombre}</div>
  </div>

  <div style="margin-bottom:8px;">
    <div style="font-size:13px; color:#555;">Distancia estimada ida y vuelta:</div>
    <div style="font-weight:bold;">${distancia} km</div>
  </div>

  <div style="margin-bottom:8px;">
    <div style="font-size:13px; color:#555;">Zona:</div>
    <div style="font-weight:bold;">${zona}</div>
  </div>

  <div style="margin-top:10px; padding:8px; border-radius:6px; background:${colorZona}; color:white; text-align:center;">
    <div style="font-size:13px;">Valor flete</div>
    <div style="font-size:22px; font-weight:bold;">
      $${flete.toLocaleString("es-CL")}
    </div>
  </div>
`;

  labelActivo = L.tooltip({ permanent:true, direction:"center", className:"comuna-label"})
  .setContent(nombre)
  .setLatLng(layer.getBounds().getCenter())
  .addTo(map);

  // Activar camión animado
  const camionContainer = document.getElementById("camion-container");
  camionContainer.style.display = "block";
  camionContainer.classList.remove("camion-moviendo");
  void camionContainer.offsetWidth;
  camionContainer.classList.add("camion-moviendo");
}

/* ===============================
   GEOJSON
================================ */
const COMUNAS_ACTIVAS = Object.keys(DISTANCIAS);

fetch("https://services3.arcgis.com/uZrwedu11XCCdHk1/ArcGIS/rest/services/Comunas_de_la_RM/FeatureServer/1/query?where=1=1&outFields=*&f=geojson")
.then(r=>r.json())
.then(data=>{
  geojson = L.geoJSON(data,{
    filter:f=>COMUNAS_ACTIVAS.includes(f.properties.NOM_COM || f.properties.COMUNA || ""),
    style:estilo,
    onEachFeature:(f,l)=>{
      const nombre=f.properties.NOM_COM || f.properties.COMUNA;
      capasPorComuna[nombre]=l;
      l.on("click",()=>seleccionar(l,nombre));
    }
  }).addTo(map);

  map.fitBounds(geojson.getBounds());

  fetch("./data/americo_vespucio.geojson")
  .then(r=>r.json())
  .then(avData=>{
    L.geoJSON(avData,{style:{color:"#c00000",weight:4,opacity:0.6}})
    .bindTooltip("Autopista Américo Vespucio",{sticky:true})
    .addTo(map);
  });
});

/* ===============================
   BUSCADOR
================================ */
const input=document.getElementById("comuna-input");
const dropdown=document.getElementById("dropdown");

input.addEventListener("input",()=>{
  const texto=input.value.toLowerCase();
  dropdown.innerHTML="";
  if(!texto) return dropdown.style.display="none";

  COMUNAS_ACTIVAS.filter(c=>c.toLowerCase().includes(texto))
  .forEach(nombre=>{
    const div=document.createElement("div");
    div.className="dropdown-item";
    div.textContent=nombre;
    div.onclick=()=>{
      input.value=nombre;
      dropdown.style.display="none";
      seleccionar(capasPorComuna[nombre],nombre);
    };
    dropdown.appendChild(div);
  });

  dropdown.style.display="block";
});

document.addEventListener("click",e=>{
  if(!document.getElementById("search-box").contains(e.target)){
    dropdown.style.display="none";
  }
});
</script>

</body>
</html>
