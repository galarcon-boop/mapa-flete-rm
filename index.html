<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flete por Comuna – Región Metropolitana</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: white;
  font-family: Arial, sans-serif;
}

#map {
  width: 100vw;
  height: 100vh;
}

/* BUSCADOR */
#search-box {
  position: absolute;
  top: 15px;
  left: 15px;
  background: white;
  padding: 10px 12px;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  z-index: 1000;
  width: 240px;
}

#search-box label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 4px;
}

#comuna-input {
  width: 100%;
  height: 30px;
  padding: 4px 6px;
  font-size: 14px;
  box-sizing: border-box;
}

#dropdown {
  margin-top: 4px;
  border: 1px solid #ccc;
  border-radius: 4px;
  max-height: 160px;
  overflow-y: auto;
  display: none;
  background: white;
}

.dropdown-item {
  padding: 6px;
  cursor: pointer;
  font-size: 14px;
}

.dropdown-item:hover {
  background: #f0f0f0;
}

/* INFO */
.info {
  position: absolute;
  bottom: 20px;
  left: 15px;
  background: white;
  padding: 14px 18px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  z-index: 999;
  min-width: 260px;
}

.valor-flete {
  font-size: 22px;
  font-weight: bold;
  color: #000;
  margin-top: 6px;
}

.comuna {
  transition: fill-opacity 0.25s ease, stroke-width 0.25s ease, stroke 0.25s ease;
}

.comuna-seleccionada {
  animation: pulsoBorde 1.8s ease-in-out infinite;
}

@keyframes pulsoBorde {
  0% { stroke-width: 3; }
  50% { stroke-width: 5; }
  100% { stroke-width: 3; }
}
</style>
</head>

<body>

<div id="search-box">
  <label>Buscar comuna</label>
  <input id="comuna-input" placeholder="Escriba una comuna">
  <div id="dropdown"></div>
</div>

<div id="map"></div>

<div class="info" id="info">
  Seleccione una comuna
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ===============================
   CONFIGURACIÓN ORIGEN
================================ */
const ORIGEN = [-33.4372, -70.6506]; // Providencia

let lineaActual = null;
let camionActual = null;
let animacionInterval = null;

function limpiarAnimacion(){
  if(lineaActual) map.removeLayer(lineaActual);
  if(camionActual) map.removeLayer(camionActual);
  if(animacionInterval) clearInterval(animacionInterval);
  lineaActual=null;
  camionActual=null;
  animacionInterval=null;
}

function animarCamion(destino, distancia){

  limpiarAnimacion();

  lineaActual = L.polyline([ORIGEN, destino],{
    color:"#000",
    weight:3,
    dashArray:"6,6"
  }).addTo(map);

  const truckIcon = L.divIcon({
    html:'<i class="fa-solid fa-truck" style="color:black;font-size:18px;"></i>',
    iconSize:[20,20],
    className:''
  });

  camionActual = L.marker(ORIGEN,{icon:truckIcon}).addTo(map);

  let progreso=0;
  let direccion=1;
  let pasos=200;
  let duracion=distancia*120;
  let intervalo=duracion/pasos;

  animacionInterval=setInterval(()=>{

    progreso+=direccion*(1/pasos);

    if(progreso>=1) direccion=-1;
    if(progreso<=0 && direccion===-1){
      clearInterval(animacionInterval);
      return;
    }

    let lat=ORIGEN[0]+(destino[0]-ORIGEN[0])*progreso;
    let lng=ORIGEN[1]+(destino[1]-ORIGEN[1])*progreso;

    camionActual.setLatLng([lat,lng]);

  },intervalo);
}

/* ===============================
   DISTANCIAS
================================ */

const DISTANCIAS = {
  "Providencia": 1,"Ñuñoa": 6.8,"Recoleta": 12.6,"Macul": 13.2,"Santiago": 13.4,
  "Independencia": 13.8,"Estación Central": 15.3,"Peñalolén": 17.2,
  "Las Condes": 17.2,"Huechuraba": 17.4,"La Reina": 18,"Vitacura": 19.2,
  "Quinta Normal": 21.6,"Conchalí": 23.8,"Renca": 25,"La Florida": 25.4,
  "San Miguel": 26.8,"Lo Prado": 29.4,"Pedro Aguirre Cerda": 29.8,
  "San Joaquín": 31,"Cerro Navia": 31.6,"La Granja": 32.6,"Quilicura": 34.6,
  "Lo Espejo": 35.8,"Lo Barnechea": 35.8,"La Cisterna": 36.4,"San Ramón": 40.1,
  "Cerrillos": 41.8,"El Bosque": 44.2,"La Pintana": 44.8,"Pudahuel": 45.6,
  "Maipú": 51.8,"Puente Alto": 53,"San Bernardo": 53.6,"Lampa": 73
};

const COMUNAS_A=["Providencia","Ñuñoa","Recoleta","Macul","Santiago","Independencia","Estación Central","Peñalolén","Las Condes","Huechuraba","La Reina","Vitacura","Quinta Normal","Conchalí"];
const COMUNAS_B=["Renca","La Florida","San Miguel","Lo Prado","Pedro Aguirre Cerda","San Joaquín","Cerro Navia","La Granja","Quilicura","Lo Espejo","La Cisterna","San Ramón"];
const COMUNAS_C=["Lo Barnechea","Cerrillos","El Bosque","La Pintana","Pudahuel","Maipú","Puente Alto","San Bernardo","Lampa"];

function obtenerZona(c){ if(COMUNAS_A.includes(c))return"A"; if(COMUNAS_B.includes(c))return"B"; if(COMUNAS_C.includes(c))return"C"; return"-";}
function obtenerFlete(c){const z=obtenerZona(c); if(z==="A")return 5000;if(z==="B")return 8000;if(z==="C")return 10000;return 0;}
function obtenerColor(c){const z=obtenerZona(c); if(z==="A")return"#4CAF50";if(z==="B")return"#FFC107";if(z==="C")return"#F44336";return"#ccc";}

/* ===============================
   MAPA
================================ */

const map=L.map('map',{zoomControl:false,minZoom:10,maxZoom:13})
.setView([-33.45,-70.66],10);

L.control.zoom({position:'bottomright'}).addTo(map);

let geojson;
let capasPorComuna={};
let comunaSeleccionada=null;

function estilo(f){
  const n=f.properties.NOM_COM||f.properties.COMUNA;
  return{fillColor:obtenerColor(n),weight:0.8,color:"#999",fillOpacity:0.55,className:"comuna"};
}

function seleccionar(layer,nombre){

  limpiarAnimacion();

  if(comunaSeleccionada) comunaSeleccionada.getElement()?.classList.remove("comuna-seleccionada");
  comunaSeleccionada=layer;
  geojson.resetStyle();

  layer.setStyle({fillOpacity:0.9,weight:3,color:"#000"});
  layer.getElement()?.classList.add("comuna-seleccionada");

  map.fitBounds(layer.getBounds(),{maxZoom:12});

  const distancia=DISTANCIAS[nombre]||0;
  const zona=obtenerZona(nombre);
  const flete=obtenerFlete(nombre);

  document.getElementById("info").innerHTML=`
    <strong style="font-size:16px;">${nombre}</strong><br>
    Distancia ida y vuelta: <strong>${distancia} km</strong><br>
    Zona: <strong>${zona}</strong>
    <div class="valor-flete">$${flete.toLocaleString("es-CL")}</div>
  `;

  const centro=layer.getBounds().getCenter();
  animarCamion([centro.lat,centro.lng],distancia);
}

const COMUNAS_ACTIVAS=Object.keys(DISTANCIAS);

fetch("https://services3.arcgis.com/uZrwedu11XCCdHk1/ArcGIS/rest/services/Comunas_de_la_RM/FeatureServer/1/query?where=1=1&outFields=*&f=geojson")
.then(r=>r.json())
.then(data=>{
  geojson=L.geoJSON(data,{
    filter:f=>COMUNAS_ACTIVAS.includes(f.properties.NOM_COM||f.properties.COMUNA||""),
    style:estilo,
    onEachFeature:(f,l)=>{
      const nombre=f.properties.NOM_COM||f.properties.COMUNA;
      capasPorComuna[nombre]=l;
      l.on("click",()=>seleccionar(l,nombre));
    }
  }).addTo(map);
  map.fitBounds(geojson.getBounds());
});

/* BUSCADOR */

const input=document.getElementById("comuna-input");
const dropdown=document.getElementById("dropdown");

input.addEventListener("input",()=>{
  const texto=input.value.toLowerCase();
  dropdown.innerHTML="";
  if(!texto) return dropdown.style.display="none";

  COMUNAS_ACTIVAS.filter(c=>c.toLowerCase().includes(texto))
  .forEach(nombre=>{
    const div=document.createElement("div");
    div.className="dropdown-item";
    div.textContent=nombre;
    div.onclick=()=>{
      input.value=nombre;
      dropdown.style.display="none";
      seleccionar(capasPorComuna[nombre],nombre);
    };
    dropdown.appendChild(div);
  });

  dropdown.style.display="block";
});

document.addEventListener("click",e=>{
  if(!document.getElementById("search-box").contains(e.target)){
    dropdown.style.display="none";
  }
});
</script>

</body>
</html>
